# Construit les installateurs Windows, macOS et Linux à chaque tag v*
# et les attache à une release GitHub en brouillon.
# Déclenchement : git tag v0.1.0 && git push origin v0.1.0
name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
          - platform: 'macos-latest'
            args: '--target x86_64-apple-darwin'
          - platform: 'ubuntu-22.04'
            args: ''
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Installer les dépendances système (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Installer Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Installer Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Installer les dépendances npm
        # Le npm livré avec Node 22 lit le verrou en version 3 sans
        # difficulté : réinstaller npm globalement n'apportait rien et
        # faisait tomber l'étape entière quand cette installation
        # échouait.
        run: npm ci

      - name: Construire et publier
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Sans ces adresses, l'application de bureau se construirait
          # sans serveur : les comptes y seraient désactivés, et le
          # direct muet. Ce sont les mêmes valeurs que la version web.
          #
          # Aucun secret ici : ce sont des adresses publiques, et la clé
          # Reverb circule déjà dans le navigateur de chaque visiteur.
          # Elle n'autorise rien à elle seule, chaque canal étant
          # autorisé au jeton du compte. Le secret Reverb, lui, reste
          # sur le serveur et n'apparaît jamais ici.
          VITE_API_URL: 'https://api.meriz.fr'
          VITE_REVERB_APP_KEY: '0t421vha7ydml81l0c2i'
          VITE_REVERB_HOST: 'api.meriz.fr'
          VITE_REVERB_PORT: '443'
          VITE_REVERB_SCHEME: 'https'
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Meriz ${{ github.ref_name }}'
          releaseBody: |
            Installateurs de Meriz pour Windows, macOS et Linux.

            **Windows** : `Meriz_<version>_x64-setup.exe`, ou le `.msi` pour un déploiement en salle machine.
            **macOS** : `aarch64.dmg` pour un Mac Apple Silicon, `x64.dmg` pour un Mac Intel.
            **Linux** : `.AppImage` à lancer tel quel, ou les paquets `.deb` et `.rpm`.

            L'application se connecte à https://api.meriz.fr, et fonctionne aussi sans compte,
            vos modèles restant alors sur votre appareil. Le téléchargement direct, par système,
            est sur https://meriz.fr/telecharger.html
          # Publication directe : les boutons du site pointent sur
          # releases/latest, qui ignore les brouillons.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
