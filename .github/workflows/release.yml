# Une modification de l'application sur main construit les logiciels,
# publie une release complète, puis déploie le même commit sur le web.
name: Release

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'src/**'
      - 'src-tauri/**'
      - 'public/**'
      - 'index.html'
      - 'package*.json'
      - 'vite.config.*'
      - 'tsconfig*.json'
      - 'scripts/release-version.mjs'
      - '.github/workflows/release.yml'
      - '.github/workflows/deploy-web.yml'
      - 'deploy/meriz-deploy-release.py'
  workflow_dispatch:

concurrency:
  group: meriz-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      commit: ${{ steps.version.outputs.commit }}
      release_id: ${{ steps.draft.outputs.result }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run test:release
      - name: Préparer une version cohérente
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "$REF_TYPE" = tag ]; then
            version=$(node -p "require('./package.json').version")
            test "$REF_NAME" = "v$version"
            tag="$REF_NAME"
          else
            test "$REF_NAME" = main
            version=$(node scripts/release-version.mjs --next)
            tag="v$version"
            git add package.json package-lock.json src-tauri/Cargo.toml src-tauri/Cargo.lock src-tauri/tauri.conf.json
            if ! git diff --cached --quiet; then
              git commit -m "Version $version [skip ci]"
            fi
            git tag "$tag"
            # Refuse de passer devant un changement concurrent sur main.
            git push --atomic origin HEAD:main "$tag"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Créer une release en brouillon
        id: draft
        uses: actions/github-script@v7
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_COMMIT: ${{ steps.version.outputs.commit }}
        with:
          script: |
            const tag = process.env.RELEASE_TAG;
            const releases = await github.paginate(github.rest.repos.listReleases, context.repo);
            const existing = releases.find(release => release.tag_name === tag);
            if (existing) {
              if (!existing.draft) throw new Error('Cette version est déjà publiée.');
              return existing.id;
            }
            const { data } = await github.rest.repos.createRelease({
              ...context.repo, tag_name: tag, target_commitish: process.env.RELEASE_COMMIT,
              name: 'Meriz '+tag, draft: true, prerelease: false,
              body: [
                'Installateurs de Meriz pour Windows, macOS et Linux.',
                '',
                'Le logiciel et app.meriz.fr sont construits depuis le même commit.',
                'À partir de 1.1.0, les mises à jour signées sont installées au démarrage.',
                'Les versions 1.0.x doivent installer cette version une première fois.',
                '',
                'Téléchargements : https://meriz.fr/telecharger.html',
              ].join('\n'),
            });
            return data.id;

  build:
    needs: prepare
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
          - platform: macos-latest
            args: --target x86_64-apple-darwin
          - platform: ubuntu-22.04
            args: ''
          - platform: windows-latest
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.commit }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
      - name: Installer les dépendances Linux
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils
      - run: npm ci
      - name: Construire et signer les installateurs
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          VITE_API_URL: https://api.meriz.fr
          VITE_REVERB_APP_KEY: 0t421vha7ydml81l0c2i
          VITE_REVERB_HOST: api.meriz.fr
          VITE_REVERB_PORT: '443'
          VITE_REVERB_SCHEME: https
        with:
          releaseId: ${{ needs.prepare.outputs.release_id }}
          tagName: ${{ needs.prepare.outputs.tag }}
          releaseDraft: true
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }}

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Vérifier le manifeste avant publication
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          gh release download "$RELEASE_TAG" --pattern latest.json --dir "$RUNNER_TEMP/updater"
          gh api "repos/$GH_REPO/releases/tags/$RELEASE_TAG" > "$RUNNER_TEMP/updater/release.json"
          node --input-type=module -e '
            import fs from "node:fs";
            const manifest = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+"/updater/latest.json", "utf8"));
            const release = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+"/updater/release.json", "utf8"));
            // tauri-action fournit des URL API : publier les liens publics stables.
            for (const entry of Object.values(manifest.platforms)) {
              const asset = release.assets.find(asset => asset.url === entry.url || asset.browser_download_url === entry.url);
              if (!asset) throw new Error("Paquet absent de cette release");
              entry.url = "https://github.com/"+process.env.GH_REPO+"/releases/download/"+process.env.RELEASE_TAG+"/"+encodeURIComponent(asset.name);
            }
            if ("v"+manifest.version.replace(/^v/, "") !== process.env.RELEASE_TAG) throw new Error("Version du manifeste incorrecte");
            for (const platform of ["windows-x86_64", "linux-x86_64", "darwin-aarch64", "darwin-x86_64"]) {
              const entry = manifest.platforms[platform];
              if (!entry?.signature || !entry.url?.startsWith("https://github.com/"+process.env.GH_REPO+"/releases/download/"+process.env.RELEASE_TAG+"/")) {
                throw new Error("Mise à jour absente ou invalide : "+platform);
              }
            }
            fs.writeFileSync(process.env.RUNNER_TEMP+"/updater/latest.json", JSON.stringify(manifest, null, 2)+"\n");
          '
          gh release upload "$RELEASE_TAG" "$RUNNER_TEMP/updater/latest.json" --clobber
      - name: Publier la release complète
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: gh release edit "$RELEASE_TAG" --draft=false --latest

  deploy:
    needs: [prepare, publish]
    uses: ./.github/workflows/deploy-web.yml
    with:
      ref: ${{ needs.prepare.outputs.commit }}
    secrets: inherit
