name: Deploy web

on:
  workflow_call:
    inputs:
      ref:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      ref:
        description: Commit ou tag à déployer
        default: main
        required: true
        type: string
  push:
    branches: [main]
    paths: ['site/**']

concurrency:
  group: deploy-web
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Construire
        env:
          VITE_API_URL: https://api.meriz.fr
          VITE_REVERB_APP_KEY: 0t421vha7ydml81l0c2i
          VITE_REVERB_HOST: api.meriz.fr
          VITE_REVERB_PORT: '443'
          VITE_REVERB_SCHEME: https
        run: |
          npm run build
          test -f dist/index.html
          grep -q 'api.meriz.fr' dist/assets/index-*.js
      - name: Préparer la connexion de déploiement restreinte
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          for name in VPS_HOST VPS_USER VPS_SSH_KEY VPS_KNOWN_HOSTS; do
            test -n "${!name}" || { echo "::error::Secret manquant : $name"; exit 1; }
          done
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "$VPS_SSH_KEY" | tr -d '\r' > "$HOME/.ssh/id_deploy"
          chmod 600 "$HOME/.ssh/id_deploy"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 644 "$HOME/.ssh/known_hosts"
      - name: Basculer l'application et la vitrine
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          stage=$(mktemp -d)
          mkdir "$stage/app" "$stage/site"
          cp -a dist/. "$stage/app/"
          cp -a site/. "$stage/site/"
          rm -f "$stage/site/LIENS.md"
          # La clé ne peut exécuter que le réceptionnaire de ce flux.
          tar -czf - -C "$stage" app site | ssh -T -i "$HOME/.ssh/id_deploy"             -o BatchMode=yes -o StrictHostKeyChecking=yes             "$VPS_USER@$VPS_HOST"
      - name: Vérifier les fichiers servis
        run: |
          curl -fsS https://app.meriz.fr/ -o "$RUNNER_TEMP/index-public.html"
          cmp dist/index.html "$RUNNER_TEMP/index-public.html"
