# Configuration nginx de l'image Docker de Meriz.
# Reprend deploy/nginx-meriz.conf. Écoute sur 8080 car nginx tourne sans
# droits root. Le HTTPS se fait en amont, par un proxy inverse.

server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Pas de numéro de version nginx dans les réponses.
    server_tokens off;

    # Contrôle de santé pour Docker et les orchestrateurs.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Repli SPA : un rafraîchissement sur n'importe quelle adresse
    # renvoie l'application, jamais une 404.
    location / {
        try_files $uri $uri/ /index.html;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
    }

    # Les assets Vite portent une empreinte dans leur nom :
    # cache long sans risque, ils changent de nom à chaque build.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # index.html ne doit jamais être mis en cache : c'est lui qui
    # pointe vers les nouveaux assets après un déploiement.
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
